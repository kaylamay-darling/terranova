# The loader version for modern NeoForge is "[1,)"
modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/kaylamay-darling/terranova/issues"

[[mods]]
modId="terranova"
version="${mod_version}" # Uses your gradle.properties value
displayName="Terra Nova"
logoFile="icon.png"
displayURL="https://github.com/kaylamay-darling/terranova"
authors="Kayla May (Code / Art), Kaya (Art)"
description='''
Enhances the Vanilla progression system, while adding world-building features. More to come...
'''

[[mixins]]
config = "terranova.mixins.json"

# NeoForge dependency
[[dependencies.terranova]]
modId="neoforge"
mandatory=true
versionRange="[26.2,)"
ordering="NONE"
side="BOTH"

# Minecraft dependency
[[dependencies.terranova]]
modId="minecraft"
mandatory=true
versionRange="[26.2,)"
ordering="NONE"
side="BOTH"